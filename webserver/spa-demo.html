<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iGO-Buddy Terminal</title>
  <link rel="stylesheet" href="spa-demo.css">
</head>
<body>

      <div>
        <div class="brand-title">iGO-Buddy Control Terminal</div>
